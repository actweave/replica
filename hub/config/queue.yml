default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
<% if ENV["REPLICA_BUILD_RUNNER"] == "self_hosted" %>
    - queues: self_hosted_builds
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: [default, builds]
<% else %>
    - queues: "*"
<% end %>
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
